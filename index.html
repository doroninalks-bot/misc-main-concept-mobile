<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex" />
    <title>Прототип</title>
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/favicon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // До первой отрисовки, иначе на тёмной теме мелькает светлая вёрстка.
      // У канваса и прототипа темы разные. ?theme= — тема экрана в рамке доски
      // «Страницы сайта» на сайте дизайн-системы, держится до конца вкладки.
      // Логика — utils/theme.ts в @banki/design-system
      try {
        var shell = /^\/(kit|canvas)(\/|$)/.test(location.pathname)
        var fromUrl = shell ? null : new URLSearchParams(location.search).get("theme")
        var override = shell ? null : fromUrl || sessionStorage.getItem("proto:theme-override")
        var theme = override || localStorage.getItem(shell ? "proto:shell-theme" : "proto:theme")
        if (theme === "dark") document.documentElement.dataset.theme = "dark"
      } catch {}
    </script>
  </head>
  <body>
    <script>
      // Экран открыт в рамке канваса — снимаем растяжку по высоте окна.
      if (new URLSearchParams(location.search).get("embed") === "1") {
        document.documentElement.classList.add("is-embed")
        document.body.classList.add("is-embed")
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
